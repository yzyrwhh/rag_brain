[project]
name = "shopkeer-server"
version = "0.1.0"
description = "掌柜智库多智能体系统后端（Phase 0 骨架）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyJWT>=2.8",
    "bcrypt>=4.1",
    "motor>=3.4",
    "pymongo>=4.7",
    "redis>=5.0",
    "minio>=7.2",
    "pymilvus>=2.4",
    "neo4j>=5.20",
    "celery>=5.3",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
