<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能产品知识库 · 知识导入</title>
<script>
// 上传功能已合并到会话页：导入页保留 URL 兼容，自动跳转并打开上传弹窗
(function(){
  var target = 'chat.html';
  try{
    var base = (location.protocol === 'file:') ? 'http://127.0.0.1:8001/' : location.href.split('/').slice(0,-1).join('/') + '/';
    // 同源托管下相对路径即可，file:// 下回退到本地服务
    if(location.protocol === 'file:') target = base + 'chat.html';
  }catch(e){}
  var u = new URL(target, location.href);
  u.hash = '#upload';
  location.replace(u.href);
})();
</script>
</head>
<body style="margin:0;background:#0b1120;color:#94a3b8;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;">
  <div style="text-align:center">
    <div style="font-size:40px;margin-bottom:12px">📥</div>
    <div>正在跳转到「智能问答」页面的上传功能…</div>
  </div>
</body>
</html>
